services:
  - type: web
    name: emergency-qr-666syimyk
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    disk:
      name: emergency-qr-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /app/data/emergency-qr.sqlite
      - key: WEB_DIST_PATH
        value: /app/frontend/dist
